services:
  mongodb:
    image: mongo:8.0
    container_name: vihaanx-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - vihaanx-mongodb-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  vihaanx-mongodb-data:
